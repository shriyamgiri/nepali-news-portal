name: GN Nepal - Smart News Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ── Step 1: Fetch new articles + Re-score previous batch ──
      - name: 📰 Step 1 - Fetch & Score
        run: |
          echo "🚀 Starting GN Nepal pipeline at $(date)"
          echo "Step 1: Fetching new articles and re-scoring previous batch..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/fetch-news")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Fetch returned $HTTP_STATUS"
          else
            echo "✅ Fetch completed successfully"
          fi

      # ── Delay between fetch and translate ──
      - name: ⏳ Delay 5 seconds
        run: |
          echo "Waiting for DB writes to complete..."
          sleep 5

      # ── Step 2: Translate TOP 3 by priority score ──
      - name: 🌐 Step 2 - Translate Best Articles
        run: |
          echo "Step 2: Translating top priority articles..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/translate")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Translation returned $HTTP_STATUS (continuing anyway)"
          else
            echo "✅ Translation completed successfully"
          fi

      # ── Delay between translate and cleanup ──
      - name: ⏳ Delay 3 seconds
        run: |
          echo "Waiting for translations to save..."
          sleep 3

      # ── Step 3: Cleanup previous batch ──
      - name: 🧹 Step 3 - Cleanup Previous Batch
        run: |
          echo "Step 3: Cleaning up previous batch unpublished articles..."
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cleanup")
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Status: $HTTP_STATUS"
          echo "Response: $BODY"
          
          echo "✅ Cleanup completed"

      # ── Pipeline Summary ──
      - name: ✅ Pipeline Complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ GN Nepal pipeline complete!"
          echo "📰 Fresh Nepali news published"
          echo "🧹 Old batch cleaned up"
          echo "⏰ Time: $(date)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"