name: GN Nepal - Auto Fetch & Publish

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ── Step 1: Keep Supabase alive (prevents free tier pause) ──
      - name: 🏓 Keep DB Alive
        run: |
          echo "Pinging health check..."
          curl -s "${{ secrets.SITE_URL }}/api/health" | head -c 200
          echo ""

      # ── Step 2: Auto-detect trending topics ──
      - name: 🔥 Detect Trending Topics
        run: |
          echo "Detecting trending topics from Google Trends..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/trending/auto" | head -c 300
          echo ""

      # ── Step 3: Smart fetch news ──
      - name: 📰 Fetch News
        run: |
          echo "Fetching trending news from all sources..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/fetch-news" | head -c 300
          echo ""

      # ── Step 4: Translate to Nepali ──
      - name: 🌐 Translate to Nepali
        run: |
          echo "Translating articles to Nepali..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/translate" | head -c 300
          echo ""

      # ── Step 5: Post to Facebook ──
      - name: 📘 Post to Facebook
        run: |
          echo "Posting to Facebook page..."
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/facebook/post" | head -c 300
          echo ""

      # ── Step 6: Confirm pipeline done ──
      - name: ✅ Pipeline Complete
        run: |
          echo "GN Nepal pipeline completed successfully!"
          echo "Time: $(date)"